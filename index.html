<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ballz - Brick Breaker</title>

    <!-- PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ballz">
    <meta name="theme-color" content="#0a0a12">
    <meta name="msapplication-TileColor" content="#0a0a12">

    <!-- Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Icons para iOS -->
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>

        <!-- Main Menu -->
        <div id="mainMenu">
            <div class="menu-orbs" aria-hidden="true">
                <div class="orb"></div>
                <div class="orb"></div>
                <div class="orb"></div>
                <div class="orb"></div>
                <div class="orb"></div>
                <div class="orb"></div>
            </div>

            <div class="menu-content">
                <div class="menu-header">
                    <h1 class="menu-title">BALLZ</h1>
                    <p class="menu-subtitle">Brick Breaker</p>
                </div>

                <button class="play-btn" id="playBtn" data-diff="medium">
                    <span class="play-btn-ring"></span>
                    <span class="play-btn-ring play-btn-ring--delayed"></span>
                    <span class="play-btn-inner">&#9654;</span>
                </button>

                <div class="diff-bar">
                    <button class="diff-chip" data-diff="easy">
                        <span class="diff-chip-emoji">😊</span>
                        <span class="diff-chip-label">Fácil</span>
                    </button>
                    <button class="diff-chip diff-chip--active" data-diff="medium">
                        <span class="diff-chip-emoji">😤</span>
                        <span class="diff-chip-label">Medio</span>
                    </button>
                    <button class="diff-chip" data-diff="hard">
                        <span class="diff-chip-emoji">💀</span>
                        <span class="diff-chip-label">Difícil</span>
                    </button>
                </div>

                <button class="menu-advanced-toggle" id="advancedToggle">
                    Turno inicial <span class="toggle-arrow">&#9662;</span>
                </button>
                <div class="menu-advanced-panel" id="advancedPanel">
                    <div class="turn-row">
                        <input type="hidden" id="startTurnInput" value="1">
                        <div class="swipe-selector" id="turnSwipeSelector">
                            <button class="swipe-arrow swipe-arrow-left" id="turnDecrease" aria-label="Decrease turn">&#8249;</button>
                            <div class="swipe-track" id="turnSwipeTrack">
                                <span class="swipe-value" id="turnSwipeValue">1</span>
                            </div>
                            <button class="swipe-arrow swipe-arrow-right" id="turnIncrease" aria-label="Increase turn">&#8250;</button>
                        </div>
                        <span class="balls-preview" id="ballsPreview">🔵 1 bola</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Game UI -->
        <div id="ui">
            <span>Turno: <b id="turnDisplay">1</b></span>
            <span id="difficultyBadge">FÁCIL</span>
            <span id="speedIndicator">⚡ 5x</span>
            <span>Bolas: <b id="ballDisplay">1</b></span>
        </div>

        <div id="instructions">👆 Arrastra para apuntar • Mantené presionado para acelerar</div>

        <button id="skipBtn">⏭️ Saltar turno</button>

        <!-- Update Banner -->
        <div id="updateBanner" class="hidden">
            🔄 Nueva versión disponible
            <button id="updateBtn">Actualizar</button>
        </div>

        <!-- Version indicator -->
        <div id="versionInfo">v2.6.3</div>

        <!-- Game Over -->
        <div id="gameOver">
            <h1>¡Game Over!</h1>
            <p>Llegaste al turno</p>
            <div class="stat" id="finalTurn">1</div>
            <p>Bolas conseguidas</p>
            <div class="stat" id="finalBalls">1</div>
            <div class="difficulty-label" id="finalDifficulty">FÁCIL</div>
            <div class="game-over-buttons">
                <button id="restartBtn">🔄 Jugar de Nuevo</button>
                <button id="menuBtn">📋 Menú Principal</button>
            </div>
        </div>
    </div>

    <!-- Test hooks: only loaded when ?testHooks=1 is in the URL.
         See tests/test-hooks.js. Production loads of the PWA never
         touch this branch. -->
    <script type="module">
        if (new URLSearchParams(location.search).has('testHooks')) {
            import('./tests/test-hooks.js');
        }
    </script>

    <!-- Scripts -->
    <script type="module" src="main.js"></script>
</body>
</html>
