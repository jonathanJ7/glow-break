<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ballz - Brick Breaker</title>

    <!-- PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ballz">
    <meta name="theme-color" content="#0a0a12">
    <meta name="msapplication-TileColor" content="#0a0a12">

    <!-- Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Icons para iOS -->
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none;
            user-select: none;
        }
        
        html, body {
            height: 100%;
            width: 100%;
        }

        body {
            background: #0a0a12;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 500px;
            background: #12121f;
            overflow: hidden;
        }
        
        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        #ui {
            position: absolute;
            top: 5px;
            left: 5px;
            right: 5px;
            display: none;
            justify-content: space-between;
            align-items: center;
            color: white;
            font-size: clamp(10px, 3vmin, 14px);
            pointer-events: none;
            z-index: 10;
        }

        #ui span {
            background: rgba(0,0,0,0.6);
            padding: clamp(4px, 1.2vmin, 6px) clamp(8px, 2vmin, 12px);
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        #difficultyBadge {
            font-size: clamp(9px, 2.5vmin, 11px);
        }

        #speedIndicator {
            background: rgba(233, 69, 96, 0.8) !important;
            display: none;
        }

        #skipBtn {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            padding: clamp(6px, 1.5vmin, 8px) clamp(12px, 3vmin, 16px);
            border-radius: 20px;
            font-size: clamp(10px, 2.5vmin, 12px);
            cursor: pointer;
            display: none;
            z-index: 50;
            transition: background 0.2s;
        }

        #skipBtn:hover {
            background: rgba(255,255,255,0.3);
        }
        
        /* Main Menu */
        #mainMenu {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }
        
        #mainMenu h1 {
            font-size: clamp(32px, 10vmin, 52px);
            color: #fff;
            margin-bottom: 5px;
            text-shadow: 0 0 30px rgba(78, 204, 163, 0.5);
            letter-spacing: 4px;
        }

        #mainMenu .subtitle {
            color: rgba(255,255,255,0.5);
            font-size: clamp(11px, 3vmin, 14px);
            margin-bottom: clamp(10px, 3vmin, 30px);
        }

        #mainMenu h2 {
            color: rgba(255,255,255,0.8);
            font-size: clamp(14px, 4vmin, 18px);
            margin-bottom: clamp(10px, 2vmin, 20px);
            font-weight: normal;
        }

        .turn-selector {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: clamp(15px, 3vmin, 30px);
            background: rgba(255,255,255,0.1);
            padding: clamp(8px, 2vmin, 12px) clamp(12px, 3vmin, 20px);
            border-radius: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .turn-selector label {
            color: rgba(255,255,255,0.8);
            font-size: clamp(11px, 3vmin, 14px);
        }

        .turn-selector input {
            width: 60px;
            padding: 6px 10px;
            border: none;
            border-radius: 15px;
            background: rgba(255,255,255,0.2);
            color: white;
            font-size: clamp(14px, 3.5vmin, 16px);
            text-align: center;
            outline: none;
        }

        .turn-selector input:focus {
            background: rgba(255,255,255,0.3);
        }

        .turn-selector .balls-preview {
            color: #4ecca3;
            font-size: clamp(10px, 2.5vmin, 13px);
        }

        .difficulty-btn {
            width: clamp(180px, 50vmin, 220px);
            padding: clamp(12px, 3vmin, 18px) clamp(20px, 5vmin, 30px);
            margin: clamp(4px, 1vmin, 8px) 0;
            border: none;
            border-radius: 30px;
            font-size: clamp(14px, 4vmin, 18px);
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
        }
        
        .difficulty-btn:hover {
            transform: scale(1.05);
        }
        
        .difficulty-btn:active {
            transform: scale(0.98);
        }
        
        .difficulty-btn .desc {
            display: block;
            font-size: 11px;
            font-weight: normal;
            opacity: 0.8;
            margin-top: 4px;
        }
        
        #easyBtn {
            background: linear-gradient(135deg, #4ecca3, #38b28a);
            color: white;
            box-shadow: 0 5px 20px rgba(78, 204, 163, 0.4);
        }
        
        #mediumBtn {
            background: linear-gradient(135deg, #f9ed69, #f5b942);
            color: #333;
            box-shadow: 0 5px 20px rgba(249, 237, 105, 0.4);
        }
        
        #hardBtn {
            background: linear-gradient(135deg, #e94560, #c23152);
            color: white;
            box-shadow: 0 5px 20px rgba(233, 69, 96, 0.4);
        }
        
        .menu-balls {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }
        
        .menu-ball {
            position: absolute;
            border-radius: 50%;
            opacity: 0.1;
        }
        
        /* Game Over */
        #gameOver {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 100;
        }
        
        #gameOver h1 {
            font-size: clamp(28px, 8vmin, 36px);
            margin-bottom: clamp(10px, 3vmin, 20px);
            color: #e94560;
        }

        #gameOver p {
            font-size: clamp(12px, 3.5vmin, 16px);
            margin-bottom: 6px;
            color: #aaa;
        }

        #gameOver .stat {
            font-size: clamp(22px, 6vmin, 28px);
            color: #4ecca3;
            margin-bottom: clamp(10px, 3vmin, 20px);
        }

        #gameOver .difficulty-label {
            font-size: clamp(11px, 3vmin, 14px);
            padding: 5px 14px;
            border-radius: 15px;
            margin-bottom: clamp(15px, 4vmin, 25px);
        }

        .game-over-buttons {
            display: flex;
            flex-direction: column;
            gap: clamp(6px, 2vmin, 10px);
        }

        #restartBtn, #menuBtn {
            background: linear-gradient(135deg, #e94560, #0f3460);
            color: white;
            border: none;
            padding: clamp(10px, 3vmin, 15px) clamp(25px, 7vmin, 40px);
            font-size: clamp(13px, 3.5vmin, 16px);
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            min-width: clamp(160px, 45vmin, 200px);
        }
        
        #menuBtn {
            background: linear-gradient(135deg, #333, #555);
        }
        
        #restartBtn:hover, #menuBtn:hover {
            transform: scale(1.05);
        }
        
        #instructions {
            position: absolute;
            bottom: 12%;
            left: 0;
            right: 0;
            text-align: center;
            color: rgba(255,255,255,0.4);
            font-size: clamp(10px, 2.8vmin, 13px);
            pointer-events: none;
            transition: opacity 0.5s;
            display: none;
            padding: 0 10px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <!-- Main Menu -->
        <div id="mainMenu">
            <div class="menu-balls" id="menuBalls"></div>
            <h1>BALLZ</h1>
            <p class="subtitle">Brick Breaker</p>
            
            <div class="turn-selector">
                <label>Empezar en turno:</label>
                <input type="number" id="startTurnInput" value="1" min="1" max="500">
                <span class="balls-preview" id="ballsPreview">🔵 1 bola</span>
            </div>
            
            <h2>Selecciona la dificultad</h2>
            <button class="difficulty-btn" id="easyBtn">
                😊 FÁCIL
                <span class="desc">Para empezar tranquilo</span>
            </button>
            <button class="difficulty-btn" id="mediumBtn">
                😤 MEDIO
                <span class="desc">Un verdadero desafío</span>
            </button>
            <button class="difficulty-btn" id="hardBtn">
                💀 DIFÍCIL
                <span class="desc">Solo para valientes</span>
            </button>
        </div>
        
        <!-- Game UI -->
        <div id="ui">
            <span>Turno: <b id="turnDisplay">1</b></span>
            <span id="difficultyBadge">FÁCIL</span>
            <span id="speedIndicator">⚡ 5x</span>
            <span>Bolas: <b id="ballDisplay">1</b></span>
        </div>
        
        <div id="instructions">👆 Arrastra para apuntar • Mantené presionado para acelerar</div>
        
        <button id="skipBtn">⏭️ Saltar turno</button>
        
        <!-- Game Over -->
        <div id="gameOver">
            <h1>¡Game Over!</h1>
            <p>Llegaste al turno</p>
            <div class="stat" id="finalTurn">1</div>
            <p>Bolas conseguidas</p>
            <div class="stat" id="finalBalls">1</div>
            <div class="difficulty-label" id="finalDifficulty">FÁCIL</div>
            <div class="game-over-buttons">
                <button id="restartBtn">🔄 Jugar de Nuevo</button>
                <button id="menuBtn">📋 Menú Principal</button>
            </div>
        </div>
    </div>

    <script>
        // ====================================
        // INICIALIZACIÓN DEL CANVAS
        // ====================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('gameContainer');
        
        // Responsive canvas
        function resizeCanvas() {
            const rect = container.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }
        resizeCanvas();

        // Guardar dimensiones anteriores para calcular proporciones
        let prevCellSize = null;
        let prevTopOffset = null;
        let prevLeftBorder = null;

        function handleResize() {
            // Guardar valores anteriores antes de resize
            const oldCellSize = prevCellSize || getCellSize();
            const oldTopOffset = prevTopOffset || getTopOffset();
            const oldLeftBorder = prevLeftBorder || getLeftBorder();

            resizeCanvas();

            // Actualizar posiciones del juego si está activo
            if (gameState && gameState.gameStarted && !gameState.gameOver) {
                const newBottomLine = getBottomLine();
                const newLeftBorder = getLeftBorder();
                const newRightBorder = getRightBorder();
                const newCellSize = getCellSize();
                const newTopOffset = getTopOffset();

                // Actualizar posición Y de lanzamiento
                gameState.launchY = newBottomLine;

                // Mantener X dentro de los límites (proporcional)
                const xRatio = (gameState.launchX - oldLeftBorder) / (getWidth() - 2 * oldLeftBorder);
                gameState.launchX = newLeftBorder + xRatio * (newRightBorder - newLeftBorder);
                gameState.launchX = Math.max(newLeftBorder + 20, Math.min(newRightBorder - 20, gameState.launchX));

                const nextXRatio = (gameState.nextLaunchX - oldLeftBorder) / (getWidth() - 2 * oldLeftBorder);
                gameState.nextLaunchX = newLeftBorder + nextXRatio * (newRightBorder - newLeftBorder);
                gameState.nextLaunchX = Math.max(newLeftBorder + 20, Math.min(newRightBorder - 20, gameState.nextLaunchX));

                // Reposicionar ladrillos
                for (let brick of gameState.bricks) {
                    // Calcular fila basada en posición Y anterior
                    const oldRow = Math.round((brick.y - oldTopOffset) / oldCellSize);
                    brick.x = newLeftBorder + brick.col * newCellSize;
                    brick.y = newTopOffset + oldRow * newCellSize;
                    brick.width = newCellSize - 4;
                    brick.height = newCellSize - 4;
                }

                // Reposicionar bonuses
                for (let bonus of gameState.bonuses) {
                    const oldCol = Math.round((bonus.x - oldLeftBorder - oldCellSize / 2) / oldCellSize);
                    const oldRow = Math.round((bonus.y - oldTopOffset - oldCellSize / 2) / oldCellSize);
                    bonus.x = newLeftBorder + oldCol * newCellSize + newCellSize / 2;
                    bonus.y = newTopOffset + oldRow * newCellSize + newCellSize / 2;
                    bonus.radius = Math.max(8, 12 * getScale());
                }

                // Reposicionar pelotas activas
                for (let ball of gameState.balls) {
                    if (ball.active) {
                        // Escalar posición proporcionalmente
                        const xRatio = (ball.x - oldLeftBorder) / (getWidth() - 2 * oldLeftBorder);
                        const yRatio = (ball.y - oldTopOffset) / (newBottomLine - oldTopOffset);
                        ball.x = newLeftBorder + xRatio * (newRightBorder - newLeftBorder);
                        ball.y = newTopOffset + yRatio * (newBottomLine - newTopOffset);
                    }
                }
            }

            // Guardar nuevas dimensiones
            prevCellSize = getCellSize();
            prevTopOffset = getTopOffset();
            prevLeftBorder = getLeftBorder();
        }

        window.addEventListener('resize', handleResize);
        
        // ====================================
        // CONSTANTES DEL JUEGO
        // ====================================
        const COLS = 7;
        const BASE_BALL_RADIUS = 6;
        const BALL_SPEED = 10;

        function getBallRadius() {
            return Math.max(4, BASE_BALL_RADIUS * getScale());
        }

        function getFontSize(baseSize) {
            return Math.max(8, Math.round(baseSize * getScale()));
        }

        const FAST_SPEED_MULTIPLIER = 5;
        const SHOOT_DELAY = 45;
        const MAX_BALLS_ON_SCREEN = 200;
        
        // ====================================
        // CONFIGURACIÓN DE DIFICULTADES
        // ====================================
        const DIFFICULTY_SETTINGS = {
            easy: {
                name: 'FÁCIL',
                emoji: '😊',
                color: '#4ecca3',
                hpMultiplier: 0.8,
                densityBase: 0.28,
                densityGrowth: 0.005,
                maxDensity: 0.55,
                bonusChance: 0.12,
                powerupChance: 0.05,
                explosiveChance: 0.06,
                armoredChance: 0.03,
                multiBallChance: 0.2,
                startingBalls: 1,
                hpVariationMin: 0.3,
                hpVariationMax: 1.0,
                poisonBrickChance: 0.04  // Bricks that spawn more bricks
            },
            medium: {
                name: 'MEDIO',
                emoji: '😤',
                color: '#f5b942',
                hpMultiplier: 1.5,
                densityBase: 0.38,
                densityGrowth: 0.008,
                maxDensity: 0.70,
                bonusChance: 0.08,
                powerupChance: 0.035,
                explosiveChance: 0.08,
                armoredChance: 0.10,
                multiBallChance: 0.1,
                startingBalls: 1,
                hpVariationMin: 0.5,
                hpVariationMax: 1.5,
                poisonBrickChance: 0.05  // Bricks that spawn more bricks
            },
            hard: {
                name: 'DIFÍCIL',
                emoji: '💀',
                color: '#e94560',
                hpMultiplier: 2.8,
                densityBase: 0.50,
                densityGrowth: 0.012,
                maxDensity: 0.85,
                bonusChance: 0.05,
                powerupChance: 0.025,
                explosiveChance: 0.04,
                armoredChance: 0.20,
                multiBallChance: 0.05,
                startingBalls: 1,
                hpVariationMin: 0.7,
                hpVariationMax: 2.0,
                // Extra hard features
                poisonBrickChance: 0.06,  // Bricks that spawn more bricks
                reinforcedRows: true       // Every 10 turns, extra tough row
            }
        };
        
        let currentDifficulty = 'easy';
        let difficultyConfig = DIFFICULTY_SETTINGS.easy;
        let startingTurn = 1;
        
        // Calculate expected balls for a given turn based on difficulty
        function calculateStartingBalls(turn, difficulty) {
            const config = DIFFICULTY_SETTINGS[difficulty];
            
            if (turn <= 1) return 1;
            
            // Simulate average ball collection
            // In easy: ~0.8-1 ball per turn
            // In medium: ~0.5-0.7 balls per turn
            // In hard: ~0.3-0.5 balls per turn
            
            const ballsPerTurn = {
                easy: 0.85,
                medium: 0.55,
                hard: 0.35
            };
            
            const rate = ballsPerTurn[difficulty];
            const baseBalls = Math.floor((turn - 1) * rate);
            
            // Add some variance (±15%)
            const variance = Math.floor(baseBalls * 0.15);
            const finalBalls = Math.max(1, baseBalls + Math.floor(Math.random() * variance * 2) - variance);
            
            return finalBalls;
        }
        
        // Update balls preview when turn input changes
        function updateBallsPreview() {
            const turnInput = document.getElementById('startTurnInput');
            const preview = document.getElementById('ballsPreview');
            const turn = Math.max(1, Math.min(500, parseInt(turnInput.value) || 1));
            
            if (turn === 1) {
                preview.innerHTML = '🔵 1 bola';
            } else {
                const easyBalls = calculateStartingBalls(turn, 'easy');
                const mediumBalls = calculateStartingBalls(turn, 'medium');
                const hardBalls = calculateStartingBalls(turn, 'hard');
                
                preview.innerHTML = `<span style="color:#4ecca3">😊${easyBalls}</span> · <span style="color:#f5b942">😤${mediumBalls}</span> · <span style="color:#e94560">💀${hardBalls}</span>`;
            }
        }
        
        // ====================================
        // ESTADO DEL JUEGO
        // ====================================
        let gameState = {
            turn: 1,
            ballCount: 1,
            balls: [],
            bricks: [],
            bonuses: [],
            particles: [],
            laserEffect: null,
            launchX: 0,
            launchY: 0,
            nextLaunchX: 0,
            isAiming: false,
            isShooting: false,
            isHolding: false,
            aimAngle: -Math.PI / 2,
            aimHistory: [], // Historial de ángulos para evitar movimientos al levantar el dedo
            ballsToShoot: 0,
            ballsLanded: 0,
            firstBallLanded: false,
            gameOver: false,
            gameStarted: false,
            showInstructions: true,
            activePowerups: {
                fireball: 0,
                superDamage: 0
            },
            speedMultiplier: 1
        };
        
        // ====================================
        // COLORES Y ESTILOS
        // ====================================
        const BRICK_COLORS = [
            '#4ecca3', '#3db892', '#2ea37f', '#1f8e6c',
            '#f9ed69', '#f5e150', '#e6cf3a', '#d4bd25',
            '#ff6b6b', '#f55555', '#e04040', '#cc2b2b',
            '#a855f7', '#9333ea', '#7e22ce', '#6b21a8',
            '#3b82f6', '#2563eb', '#1d4ed8', '#1e40af'
        ];
        
        // ====================================
        // UTILIDADES DE CANVAS Y DIMENSIONES
        // ====================================
        function getWidth() {
            return container.getBoundingClientRect().width;
        }

        function getHeight() {
            return container.getBoundingClientRect().height;
        }

        function getScale() {
            // Base height reference is 700px
            return Math.min(getHeight() / 700, getWidth() / 400);
        }

        function getCellSize() {
            const maxCellWidth = (getWidth() - 20) / COLS;
            // Usar el espacio real disponible entre topOffset y bottomLine
            const availableHeight = getBottomLine() - getTopOffset() - 40; // 40px para la pelota
            const maxCellHeight = availableHeight / 7; // Espacio para ~7 filas de ladrillos
            return Math.min(maxCellWidth, maxCellHeight);
        }

        function getLeftBorder() {
            const cellSize = getCellSize();
            const gridWidth = cellSize * COLS;
            return (getWidth() - gridWidth) / 2;
        }

        function getRightBorder() {
            return getWidth() - getLeftBorder();
        }

        function getTopOffset() {
            return Math.max(40, getHeight() * 0.07);
        }

        function getBottomLine() {
            // Espacio mínimo para la pelota y el contador
            return getHeight() - Math.max(35, getHeight() * 0.06);
        }
        
        function getBrickColor(hp, maxHp) {
            const ratio = hp / Math.max(maxHp, 1);
            const index = Math.min(Math.floor((1 - ratio) * 4) + Math.floor(Math.log2(maxHp + 1)) * 4, BRICK_COLORS.length - 1);
            return BRICK_COLORS[Math.max(0, index)];
        }
        
        // Menu animations
        function createMenuBalls() {
            const container = document.getElementById('menuBalls');
            container.innerHTML = '';
            
            for (let i = 0; i < 15; i++) {
                const ball = document.createElement('div');
                ball.className = 'menu-ball';
                const size = 20 + Math.random() * 60;
                ball.style.width = size + 'px';
                ball.style.height = size + 'px';
                ball.style.left = Math.random() * 100 + '%';
                ball.style.top = Math.random() * 100 + '%';
                ball.style.background = ['#4ecca3', '#f9ed69', '#e94560', '#a855f7', '#3b82f6'][Math.floor(Math.random() * 5)];
                container.appendChild(ball);
            }
        }
        
        // Initialize game
        function initGame(difficulty) {
            currentDifficulty = difficulty;
            difficultyConfig = DIFFICULTY_SETTINGS[difficulty];
            
            // Get starting turn from input
            const turnInput = document.getElementById('startTurnInput');
            startingTurn = Math.max(1, Math.min(500, parseInt(turnInput.value) || 1));
            
            // Calculate starting balls based on turn
            const startingBalls = calculateStartingBalls(startingTurn, difficulty);
            
            const width = getWidth();
            
            gameState = {
                turn: startingTurn,
                ballCount: startingBalls,
                balls: [],
                bricks: [],
                bonuses: [],
                particles: [],
                laserEffect: null,
                launchX: width / 2,
                launchY: getBottomLine(),
                nextLaunchX: width / 2,
                isAiming: false,
                isShooting: false,
                isHolding: false,
                aimAngle: -Math.PI / 2,
                aimHistory: [],
                ballsToShoot: 0,
                ballsLanded: 0,
                firstBallLanded: false,
                gameOver: false,
                gameStarted: true,
                showInstructions: true,
                activePowerups: {
                    fireball: 0,
                    superDamage: 0
                },
                speedMultiplier: 1
            };
            
            // Hide menu, show game UI
            document.getElementById('mainMenu').style.display = 'none';
            document.getElementById('gameOver').style.display = 'none';
            document.getElementById('ui').style.display = 'flex';
            document.getElementById('instructions').style.display = 'block';
            document.getElementById('instructions').style.opacity = '1';
            document.getElementById('speedIndicator').style.display = 'none';
            document.getElementById('skipBtn').style.display = 'none';
            
            // Update difficulty badge
            const badge = document.getElementById('difficultyBadge');
            badge.textContent = difficultyConfig.emoji + ' ' + difficultyConfig.name;
            badge.style.background = difficultyConfig.color;
            badge.style.color = difficulty === 'medium' ? '#333' : 'white';
            
            // Generate initial board state based on starting turn
            // Create multiple rows to simulate game state at that turn
            const rowsToGenerate = Math.min(6, Math.floor(startingTurn / 3) + 1);
            
            for (let i = 0; i < rowsToGenerate; i++) {
                generateNewRow();
                // Move existing bricks down for each new row (except the last one)
                if (i < rowsToGenerate - 1) {
                    const cellSize = getCellSize();
                    for (let brick of gameState.bricks) {
                        brick.y += cellSize;
                    }
                    for (let bonus of gameState.bonuses) {
                        bonus.y += cellSize;
                    }
                }
            }
            
            updateUI();
        }
        
        function showMainMenu() {
            gameState.gameStarted = false;
            document.getElementById('mainMenu').style.display = 'flex';
            document.getElementById('gameOver').style.display = 'none';
            document.getElementById('ui').style.display = 'none';
            document.getElementById('instructions').style.display = 'none';
            
            // Reset turn input to 1 or keep the last value
            // document.getElementById('startTurnInput').value = 1;
            updateBallsPreview();
            createMenuBalls();
        }
        
        // Generate a new row of bricks
        // ====================================
        // GENERACIÓN DE BLOQUES Y BONUS
        // ====================================
        function generateNewRow() {
            const cellSize = getCellSize();
            const topOffset = getTopOffset();
            const leftBorder = getLeftBorder();
            const turn = gameState.turn;
            const config = difficultyConfig;
            
            // Calculate base HP with difficulty multiplier
            const baseHP = Math.floor(turn * (1 + Math.log(turn + 1) * 0.25) * config.hpMultiplier);
            
            // Density increases with turns
            const density = Math.min(config.densityBase + turn * config.densityGrowth, config.maxDensity);
            
            // Check for reinforced row (hard mode)
            const isReinforcedRow = config.reinforcedRows && turn % 10 === 0;
            const rowHpMultiplier = isReinforcedRow ? 2.0 : 1.0;
            
            // Generate row
            let bonusPlaced = false;
            let powerupPlaced = false;
            
            for (let col = 0; col < COLS; col++) {
                const rand = Math.random();
                
                if (rand < density) {
                    // Create brick
                    const hpVariation = config.hpVariationMin + Math.random() * (config.hpVariationMax - config.hpVariationMin);
                    const hp = Math.max(1, Math.floor(baseHP * hpVariation * rowHpMultiplier));
                    
                    // Chance for special brick types
                    // FIX: Corregida la lógica para que spawners aparezcan en TODAS las dificultades
                    // Los rangos de probabilidad ahora NO se superponen
                    let type = 'normal';
                    const specialRoll = Math.random();
                    let cumulativeProbability = 0;

                    // Explosive: [0, explosiveChance)
                    if (turn > 3) {
                        const explosiveThreshold = cumulativeProbability + config.explosiveChance;
                        if (specialRoll >= cumulativeProbability && specialRoll < explosiveThreshold) {
                            type = 'explosive';
                        }
                        cumulativeProbability = explosiveThreshold;
                    }

                    // Armored: [explosiveChance, explosiveChance + armoredChance)
                    if (type === 'normal' && turn > 5) {
                        const armoredThreshold = cumulativeProbability + config.armoredChance;
                        if (specialRoll >= cumulativeProbability && specialRoll < armoredThreshold) {
                            type = 'armored';
                        }
                        cumulativeProbability = armoredThreshold;
                    }

                    // Spawner: [explosiveChance + armoredChance, explosiveChance + armoredChance + spawnerChance)
                    // ESTE ES EL FIX CRÍTICO: Ahora los spawners se generarán en easy, medium y hard
                    if (type === 'normal' && config.poisonBrickChance && turn > 8) {
                        const spawnerThreshold = cumulativeProbability + config.poisonBrickChance;
                        if (specialRoll >= cumulativeProbability && specialRoll < spawnerThreshold) {
                            type = 'spawner';
                        }
                    }
                    
                    gameState.bricks.push({
                        x: leftBorder + col * cellSize,
                        y: topOffset,
                        width: cellSize - 4,
                        height: cellSize - 4,
                        hp: hp,
                        maxHp: hp,
                        col: col,
                        type: type,
                        isReinforced: isReinforcedRow
                    });
                } else if (rand < density + config.bonusChance && !bonusPlaced) {
                    // Create bonus ball
                    const bonusCount = Math.random() < config.multiBallChance && turn > 10 ? 2 : 1;
                    gameState.bonuses.push({
                        x: leftBorder + col * cellSize + cellSize / 2,
                        y: topOffset + cellSize / 2,
                        radius: Math.max(8, 12 * getScale()),
                        type: 'ball',
                        value: bonusCount
                    });
                    bonusPlaced = true;
                } else if (rand < density + config.bonusChance + config.powerupChance && !powerupPlaced && turn > 3) {
                    // Create powerup
                    const powerupTypes = ['fireball', 'horizontal', 'superDamage'];
                    const ptype = powerupTypes[Math.floor(Math.random() * powerupTypes.length)];
                    gameState.bonuses.push({
                        x: leftBorder + col * cellSize + cellSize / 2,
                        y: topOffset + cellSize / 2,
                        radius: Math.max(10, 14 * getScale()),
                        type: ptype
                    });
                    powerupPlaced = true;
                }
            }
            
            // Ensure at least one bonus every few rows (easier on easy, harder on hard)
            const guaranteedBonusChance = currentDifficulty === 'easy' ? 0.9 : currentDifficulty === 'medium' ? 0.6 : 0.35;
            if (!bonusPlaced && Math.random() < guaranteedBonusChance) {
                const emptyCol = findEmptyColumn();
                if (emptyCol !== -1) {
                    gameState.bonuses.push({
                        x: leftBorder + emptyCol * cellSize + cellSize / 2,
                        y: topOffset + cellSize / 2,
                        radius: Math.max(8, 12 * getScale()),
                        type: 'ball',
                        value: 1
                    });
                }
            }
        }
        
        function findEmptyColumn() {
            const cellSize = getCellSize();
            const topOffset = getTopOffset();
            const occupiedCols = new Set(gameState.bricks
                .filter(b => b.y < topOffset + cellSize)
                .map(b => b.col));
            
            const bonusCols = new Set(gameState.bonuses
                .filter(b => b.y < topOffset + cellSize)
                .map(b => Math.floor((b.x - getLeftBorder()) / cellSize)));
            
            const emptyCols = [];
            for (let i = 0; i < COLS; i++) {
                if (!occupiedCols.has(i) && !bonusCols.has(i)) emptyCols.push(i);
            }
            
            return emptyCols.length > 0 ? emptyCols[Math.floor(Math.random() * emptyCols.length)] : -1;
        }
        
        // Move bricks down
        function moveBricksDown() {
            const cellSize = getCellSize();
            
            for (let brick of gameState.bricks) {
                brick.y += cellSize;
                
                // Check game over
                if (brick.y + brick.height > getBottomLine() - 10) {
                    endGame();
                    return;
                }
            }
            
            for (let bonus of gameState.bonuses) {
                bonus.y += cellSize;
                
                if (bonus.y > getBottomLine() - 20) {
                    gameState.bonuses = gameState.bonuses.filter(b => b !== bonus);
                }
            }
        }
        
        // Shooting mechanics
        function startShooting() {
            if (gameState.isShooting || gameState.gameOver) return;
            
            gameState.isShooting = true;
            gameState.shootingTime = 0; // Reset safety timer
            gameState.ballsToShoot = Math.min(gameState.ballCount, MAX_BALLS_ON_SCREEN);
            gameState.ballsLanded = 0;
            gameState.firstBallLanded = false;
            gameState.showInstructions = false;
            document.getElementById('instructions').style.opacity = '0';
            document.getElementById('skipBtn').style.display = 'block';
            
            shootNextBall();
        }
        
        let shootTimeout = null;
        
        function shootNextBall() {
            if (gameState.ballsToShoot <= 0 || gameState.gameOver) return;
            
            const vx = Math.cos(gameState.aimAngle) * BALL_SPEED;
            const vy = Math.sin(gameState.aimAngle) * BALL_SPEED;
            
            const isFireball = gameState.activePowerups.fireball > 0;
            if (isFireball) gameState.activePowerups.fireball--;
            
            const isSuperDamage = gameState.activePowerups.superDamage > 0;
            if (isSuperDamage) gameState.activePowerups.superDamage--;
            
            gameState.balls.push({
                x: gameState.launchX,
                y: gameState.launchY - getBallRadius() - 1,
                vx: vx,
                vy: vy,
                active: true,
                hasGoneUp: false,
                fireball: isFireball,
                damage: isSuperDamage ? 3 : 1,
                hitBricks: isFireball ? new Set() : null  // Track bricks hit by fireball
            });
            
            gameState.ballsToShoot--;
            
            if (gameState.ballsToShoot > 0) {
                const delay = gameState.speedMultiplier > 1 ? SHOOT_DELAY / 3 : SHOOT_DELAY;
                shootTimeout = setTimeout(shootNextBall, delay);
            }
        }
        
        // Particle effects
        function createParticles(x, y, color, count = 8) {
            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
                const speed = 2 + Math.random() * 3;
                gameState.particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1,
                    color: color,
                    size: 3 + Math.random() * 3
                });
            }
        }
        
        function updateParticles() {
            for (let p of gameState.particles) {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.03;
                p.vy += 0.1;
            }
            gameState.particles = gameState.particles.filter(p => p.life > 0);
            
            // Update laser effect
            if (gameState.laserEffect) {
                gameState.laserEffect.alpha -= 0.05;
                if (gameState.laserEffect.alpha <= 0) {
                    gameState.laserEffect = null;
                }
            }
        }
        
        // Explosion for explosive bricks
        function explodeBrick(brick) {
            const cellSize = getCellSize();
            const centerX = brick.x + brick.width / 2;
            const centerY = brick.y + brick.height / 2;
            
            createParticles(centerX, centerY, '#ff6b6b', 16);
            
            const explosionRadius = cellSize * 1.5;
            for (let other of gameState.bricks) {
                if (other === brick) continue;
                const otherCenterX = other.x + other.width / 2;
                const otherCenterY = other.y + other.height / 2;
                const dist = Math.hypot(centerX - otherCenterX, centerY - otherCenterY);
                
                if (dist < explosionRadius) {
                    const damage = Math.floor(brick.maxHp * 0.5);
                    other.hp -= damage;
                }
            }
        }
        
        // Spawner brick creates new bricks when destroyed
        function spawnBricks(brick) {
            const cellSize = getCellSize();
            const leftBorder = getLeftBorder();
            
            createParticles(brick.x + brick.width/2, brick.y + brick.height/2, '#a855f7', 12);
            
            // Spawn 1-2 small bricks nearby
            const spawnCount = 1 + Math.floor(Math.random() * 2);
            const nearbyPositions = [];
            
            for (let dc = -1; dc <= 1; dc++) {
                const newCol = brick.col + dc;
                if (newCol >= 0 && newCol < COLS) {
                    const newX = leftBorder + newCol * cellSize;
                    const newY = brick.y;
                    
                    // Check if position is empty
                    const occupied = gameState.bricks.some(b => 
                        Math.abs(b.x - newX) < cellSize * 0.5 && Math.abs(b.y - newY) < cellSize * 0.5
                    );
                    
                    if (!occupied) {
                        nearbyPositions.push({col: newCol, x: newX, y: newY});
                    }
                }
            }
            
            for (let i = 0; i < Math.min(spawnCount, nearbyPositions.length); i++) {
                const pos = nearbyPositions[Math.floor(Math.random() * nearbyPositions.length)];
                nearbyPositions.splice(nearbyPositions.indexOf(pos), 1);

                const hp = Math.floor(brick.maxHp * 0.5);
                gameState.bricks.push({
                    x: pos.x,
                    y: pos.y,
                    width: cellSize - 4,
                    height: cellSize - 4,
                    hp: hp,
                    maxHp: hp,
                    col: pos.col,
                    type: 'spawner'
                });
            }
        }
        
        // Horizontal laser - finds nearest row with bricks and destroys them
        function fireHorizontalLaser(ballY) {
            const cellSize = getCellSize();
            const leftBorder = getLeftBorder();
            const rightBorder = getRightBorder();
            
            // Find the nearest row with bricks
            let targetY = null;
            let minDist = Infinity;
            
            for (let brick of gameState.bricks) {
                const brickCenterY = brick.y + brick.height / 2;
                const dist = Math.abs(ballY - brickCenterY);
                if (dist < minDist) {
                    minDist = dist;
                    targetY = brickCenterY;
                }
            }
            
            if (targetY === null) return;
            
            // Create laser effect
            gameState.laserEffect = {
                y: targetY,
                alpha: 1,
                width: rightBorder - leftBorder
            };
            
            // Create particles along the laser line
            for (let x = leftBorder; x < rightBorder; x += 30) {
                createParticles(x, targetY, '#3b82f6', 3);
            }
            
            // Damage all bricks in that row (same Y position within tolerance)
            for (let brick of gameState.bricks) {
                const brickCenterY = brick.y + brick.height / 2;
                if (Math.abs(brickCenterY - targetY) < cellSize / 2) {
                    // Deal significant damage - 50% of max HP or destroy weak bricks
                    const damage = Math.max(Math.ceil(brick.maxHp * 0.5), Math.ceil(brick.hp * 0.6));
                    brick.hp -= damage;
                    createParticles(brick.x + brick.width/2, brick.y + brick.height/2, '#3b82f6', 5);
                }
            }
        }
        
        // Ball physics
        function updateBalls() {
            const width = getWidth();
            const leftBorder = getLeftBorder();
            const rightBorder = getRightBorder();
            const bottomLine = getBottomLine();
            // La pelota debe subir al menos hasta la mitad del área de juego antes de poder aterrizar
            const minY = getTopOffset() + (getBottomLine() - getTopOffset()) * 0.6;
            const topLimit = getTopOffset() - 15;
            
            const iterations = gameState.speedMultiplier > 1 ? FAST_SPEED_MULTIPLIER : 1;
            
            for (let iter = 0; iter < iterations; iter++) {
                for (let ball of gameState.balls) {
                    if (!ball.active) continue;
                    
                    ball.x += ball.vx;
                    ball.y += ball.vy;
                    
                    if (ball.y < minY) {
                        ball.hasGoneUp = true;
                    }
                    
                    // Wall collisions
                    if (ball.x - getBallRadius() < leftBorder) {
                        ball.x = leftBorder + getBallRadius();
                        ball.vx *= -1;
                    }
                    if (ball.x + getBallRadius() > rightBorder) {
                        ball.x = rightBorder - getBallRadius();
                        ball.vx *= -1;
                    }
                    if (ball.y - getBallRadius() < topLimit) {
                        ball.y = topLimit + getBallRadius();
                        ball.vy *= -1;
                    }
                    
                    // Bottom - ball lands (only if it has gone up first)
                    if (ball.hasGoneUp && ball.y + getBallRadius() > bottomLine) {
                        ball.y = bottomLine;
                        ball.active = false;
                        gameState.ballsLanded++;
                        
                        if (!gameState.firstBallLanded) {
                            gameState.firstBallLanded = true;
                            gameState.nextLaunchX = Math.max(leftBorder + 20, Math.min(rightBorder - 20, ball.x));
                        }
                    }
                    
                    // Safety: force land balls that are somehow out of bounds or stuck
                    if (ball.x < 0 || ball.x > width || ball.y > getHeight() || ball.y < 0) {
                        ball.active = false;
                        gameState.ballsLanded++;
                        if (!gameState.firstBallLanded) {
                            gameState.firstBallLanded = true;
                            gameState.nextLaunchX = width / 2;
                        }
                    }
                    
                    // Safety: if ball has been active too long (stuck in loop), force land it
                    ball.lifetime = (ball.lifetime || 0) + 1;
                    if (ball.lifetime > 5000) { // ~83 seconds at 60fps
                        ball.active = false;
                        gameState.ballsLanded++;
                        if (!gameState.firstBallLanded) {
                            gameState.firstBallLanded = true;
                            gameState.nextLaunchX = width / 2;
                        }
                    }
                    
                    checkBrickCollisions(ball);
                    checkBonusCollisions(ball);
                }
                
                // Handle destroyed bricks
                const destroyedBricks = gameState.bricks.filter(b => b.hp <= 0);
                for (let brick of destroyedBricks) {
                    if (brick.type === 'explosive') {
                        explodeBrick(brick);
                    } else if (brick.type === 'spawner') {
                        spawnBricks(brick);
                    }
                }
                gameState.bricks = gameState.bricks.filter(b => b.hp > 0);
            }
            
            // Check if turn should end
            checkTurnEnd();
        }
        
        // Separate function to check if turn should end - with safety checks
        function checkTurnEnd() {
            if (!gameState.isShooting) return;
            
            const activeBalls = gameState.balls.filter(b => b.active).length;
            const allBallsShot = gameState.ballsToShoot === 0;
            const noBallsActive = activeBalls === 0;
            
            // Normal end condition
            if (allBallsShot && noBallsActive) {
                endTurn();
                return;
            }
            
            // Safety: if we've been shooting for too long with no active balls, force end
            gameState.shootingTime = (gameState.shootingTime || 0) + 1;
            
            // If shooting for more than 10 seconds (600 frames) with no balls, something is wrong
            if (gameState.shootingTime > 600 && noBallsActive) {
                console.log('Safety: forcing turn end due to stuck state');
                endTurn();
                return;
            }
            
            // If shooting for more than 30 seconds total, force end
            if (gameState.shootingTime > 1800) {
                console.log('Safety: forcing turn end due to timeout');
                // Force all balls to land
                for (let ball of gameState.balls) {
                    ball.active = false;
                }
                endTurn();
                return;
            }
        }
        
        function checkBrickCollisions(ball) {
            for (let brick of gameState.bricks) {
                if (brick.hp <= 0) continue;

                // Create a unique ID for this brick based on its position
                const brickId = `${brick.x},${brick.y}`;

                if (circleRectCollision(ball.x, ball.y, getBallRadius(),
                    brick.x + 2, brick.y + 2, brick.width, brick.height)) {

                    if (!ball.fireball) {
                        // Normal ball: bounce and deal damage
                        const ballCenterX = ball.x;
                        const ballCenterY = ball.y;
                        const brickCenterX = brick.x + 2 + brick.width / 2;
                        const brickCenterY = brick.y + 2 + brick.height / 2;

                        const dx = ballCenterX - brickCenterX;
                        const dy = ballCenterY - brickCenterY;

                        const overlapX = brick.width / 2 + getBallRadius() - Math.abs(dx);
                        const overlapY = brick.height / 2 + getBallRadius() - Math.abs(dy);

                        if (overlapX < overlapY) {
                            ball.vx *= -1;
                            ball.x += dx > 0 ? overlapX : -overlapX;
                        } else {
                            ball.vy *= -1;
                            ball.y += dy > 0 ? overlapY : -overlapY;
                        }

                        const damage = ball.damage * (brick.type === 'armored' ? 0.5 : 1);
                        brick.hp -= damage;

                        if (gameState.speedMultiplier === 1) {
                            createParticles(ball.x, ball.y, getBrickColor(brick.hp, brick.maxHp), 3);
                        }

                        return; // Normal ball stops checking after first hit
                    } else {
                        // Fireball: pass through but only hit each brick once
                        if (!ball.hitBricks.has(brickId)) {
                            ball.hitBricks.add(brickId);

                            const damage = ball.damage * (brick.type === 'armored' ? 0.5 : 1);
                            brick.hp -= damage;

                            if (gameState.speedMultiplier === 1) {
                                createParticles(ball.x, ball.y, getBrickColor(brick.hp, brick.maxHp), 3);
                            }
                        }
                        // Fireball continues checking other bricks (no return)
                    }
                } else if (ball.fireball && ball.hitBricks && ball.hitBricks.has(brickId)) {
                    // Fireball has exited this brick, allow it to be hit again if it re-enters
                    ball.hitBricks.delete(brickId);
                }
            }
        }
        
        function checkBonusCollisions(ball) {
            for (let bonus of gameState.bonuses) {
                const dist = Math.hypot(ball.x - bonus.x, ball.y - bonus.y);
                
                if (dist < getBallRadius() + bonus.radius) {
                    if (bonus.type === 'ball') {
                        gameState.ballCount += bonus.value || 1;
                    } else if (bonus.type === 'fireball') {
                        gameState.activePowerups.fireball += 10;
                    } else if (bonus.type === 'superDamage') {
                        gameState.activePowerups.superDamage += 15;
                    } else if (bonus.type === 'horizontal') {
                        fireHorizontalLaser(ball.y);
                    }
                    
                    createParticles(bonus.x, bonus.y, '#4ecca3', 6);
                    gameState.bonuses = gameState.bonuses.filter(b => b !== bonus);
                    updateUI();
                }
            }
        }
        
        function circleRectCollision(cx, cy, cr, rx, ry, rw, rh) {
            const closestX = Math.max(rx, Math.min(cx, rx + rw));
            const closestY = Math.max(ry, Math.min(cy, ry + rh));
            const dist = Math.hypot(cx - closestX, cy - closestY);
            return dist < cr;
        }
        
        function endTurn() {
            gameState.isShooting = false;
            gameState.balls = [];
            gameState.shootingTime = 0;
            gameState.launchX = gameState.nextLaunchX || getWidth() / 2;
            gameState.turn++;
            gameState.speedMultiplier = 1;
            document.getElementById('speedIndicator').style.display = 'none';
            document.getElementById('skipBtn').style.display = 'none';
            
            if (shootTimeout) {
                clearTimeout(shootTimeout);
                shootTimeout = null;
            }
            
            moveBricksDown();
            
            if (!gameState.gameOver) {
                generateNewRow();
                updateUI();
            }
        }
        
        function endGame() {
            gameState.gameOver = true;
            gameState.speedMultiplier = 1;
            document.getElementById('speedIndicator').style.display = 'none';
            document.getElementById('skipBtn').style.display = 'none';
            document.getElementById('finalTurn').textContent = gameState.turn;
            document.getElementById('finalBalls').textContent = gameState.ballCount;
            
            const diffLabel = document.getElementById('finalDifficulty');
            diffLabel.textContent = difficultyConfig.emoji + ' ' + difficultyConfig.name;
            diffLabel.style.background = difficultyConfig.color;
            diffLabel.style.color = currentDifficulty === 'medium' ? '#333' : 'white';
            
            document.getElementById('gameOver').style.display = 'flex';
        }
        
        function updateUI() {
            document.getElementById('turnDisplay').textContent = gameState.turn;
            document.getElementById('ballDisplay').textContent = gameState.ballCount;
        }
        
        // Trajectory prediction
        function calculateTrajectory(startX, startY, angle, maxBounces) {
            const leftBorder = getLeftBorder();
            const rightBorder = getRightBorder();
            const topLimit = getTopOffset() - 15;
            const points = [{x: startX, y: startY, isBounce: false}];
            
            let x = startX;
            let y = startY;
            let vx = Math.cos(angle);
            let vy = Math.sin(angle);
            let bounces = 0;
            const maxDistance = 1200;
            let totalDistance = 0;
            
            while (bounces <= maxBounces && totalDistance < maxDistance) {
                let minDist = Infinity;
                let hitType = null;
                let hitSide = null;
                
                if (vx < 0) {
                    const dist = (leftBorder + getBallRadius() - x) / vx;
                    if (dist > 0 && dist < minDist) {
                        minDist = dist;
                        hitType = 'left';
                    }
                }
                if (vx > 0) {
                    const dist = (rightBorder - getBallRadius() - x) / vx;
                    if (dist > 0 && dist < minDist) {
                        minDist = dist;
                        hitType = 'right';
                    }
                }
                if (vy < 0) {
                    const dist = (topLimit + getBallRadius() - y) / vy;
                    if (dist > 0 && dist < minDist) {
                        minDist = dist;
                        hitType = 'top';
                    }
                }
                
                for (let brick of gameState.bricks) {
                    const collision = raycastToBrick(x, y, vx, vy, brick);
                    if (collision && collision.dist > 0.1 && collision.dist < minDist) {
                        minDist = collision.dist;
                        hitType = 'brick';
                        hitSide = collision.side;
                    }
                }
                
                if (minDist === Infinity || minDist > maxDistance - totalDistance) {
                    const remainingDist = Math.min(250, maxDistance - totalDistance);
                    points.push({
                        x: x + vx * remainingDist,
                        y: y + vy * remainingDist,
                        isBounce: false
                    });
                    break;
                }
                
                x += vx * minDist;
                y += vy * minDist;
                totalDistance += minDist;
                
                points.push({x: x, y: y, isBounce: true});
                bounces++;
                
                if (hitType === 'left' || hitType === 'right') {
                    vx *= -1;
                } else if (hitType === 'top') {
                    vy *= -1;
                } else if (hitType === 'brick') {
                    if (hitSide === 'left' || hitSide === 'right') {
                        vx *= -1;
                    } else {
                        vy *= -1;
                    }
                }
            }
            
            return points;
        }
        
        function raycastToBrick(x, y, vx, vy, brick) {
            const brickLeft = brick.x + 2;
            const brickRight = brick.x + 2 + brick.width;
            const brickTop = brick.y + 2;
            const brickBottom = brick.y + 2 + brick.height;
            
            const left = brickLeft - getBallRadius();
            const right = brickRight + getBallRadius();
            const top = brickTop - getBallRadius();
            const bottom = brickBottom + getBallRadius();
            
            let minDist = Infinity;
            let hitSide = null;
            
            if (vx > 0 && x < left) {
                const t = (left - x) / vx;
                const hitY = y + vy * t;
                if (t > 0 && hitY >= brickTop && hitY <= brickBottom && t < minDist) {
                    minDist = t;
                    hitSide = 'left';
                }
            }
            if (vx < 0 && x > right) {
                const t = (right - x) / vx;
                const hitY = y + vy * t;
                if (t > 0 && hitY >= brickTop && hitY <= brickBottom && t < minDist) {
                    minDist = t;
                    hitSide = 'right';
                }
            }
            if (vy > 0 && y < top) {
                const t = (top - y) / vy;
                const hitX = x + vx * t;
                if (t > 0 && hitX >= brickLeft && hitX <= brickRight && t < minDist) {
                    minDist = t;
                    hitSide = 'top';
                }
            }
            if (vy < 0 && y > bottom) {
                const t = (bottom - y) / vy;
                const hitX = x + vx * t;
                if (t > 0 && hitX >= brickLeft && hitX <= brickRight && t < minDist) {
                    minDist = t;
                    hitSide = 'bottom';
                }
            }
            
            if (minDist === Infinity) return null;
            return {dist: minDist, side: hitSide};
        }
        
        // Drawing
        function draw() {
            const width = getWidth();
            const height = getHeight();
            const leftBorder = getLeftBorder();
            const rightBorder = getRightBorder();
            
            ctx.fillStyle = '#12121f';
            ctx.fillRect(0, 0, width, height);
            
            if (!gameState.gameStarted) return;
            
            // Draw play area border
            const topY = getTopOffset() - 15;
            const areaHeight = getBottomLine() - topY + 10;

            ctx.strokeStyle = '#2a2a45';
            ctx.lineWidth = 3;
            ctx.strokeRect(leftBorder, topY, rightBorder - leftBorder, areaHeight);

            ctx.strokeStyle = `${difficultyConfig.color}40`;
            ctx.lineWidth = 1;
            ctx.strokeRect(leftBorder - 1, topY - 1, rightBorder - leftBorder + 2, areaHeight + 2);
            
            // Draw bottom line
            ctx.strokeStyle = 'rgba(233, 69, 96, 0.5)';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(leftBorder, getBottomLine());
            ctx.lineTo(rightBorder, getBottomLine());
            ctx.stroke();
            ctx.setLineDash([]);
            
            // Draw grid lines
            ctx.strokeStyle = 'rgba(255,255,255,0.03)';
            ctx.lineWidth = 1;
            const cellSize = getCellSize();
            for (let i = 1; i < COLS; i++) {
                ctx.beginPath();
                ctx.moveTo(leftBorder + i * cellSize, getTopOffset() - 20);
                ctx.lineTo(leftBorder + i * cellSize, getBottomLine());
                ctx.stroke();
            }
            
            // Draw bricks
            for (let brick of gameState.bricks) {
                const color = getBrickColor(brick.hp, brick.maxHp);
                
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath();
                ctx.roundRect(brick.x + 4, brick.y + 4, brick.width, brick.height, 6);
                ctx.fill();
                
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.roundRect(brick.x + 2, brick.y + 2, brick.width, brick.height, 6);
                ctx.fill();
                
                // Reinforced row glow
                if (brick.isReinforced) {
                    ctx.strokeStyle = 'rgba(233, 69, 96, 0.6)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.roundRect(brick.x + 2, brick.y + 2, brick.width, brick.height, 6);
                    ctx.stroke();
                }
                
                // Special brick indicators
                if (brick.type === 'explosive') {
                    ctx.fillStyle = 'rgba(255,100,100,0.3)';
                    ctx.beginPath();
                    ctx.roundRect(brick.x + 2, brick.y + 2, brick.width, brick.height, 6);
                    ctx.fill();

                    ctx.fillStyle = 'rgba(255,255,255,0.8)';
                    ctx.font = `${getFontSize(12)}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.fillText('💥', brick.x + 2 + brick.width / 2, brick.y + 15 * getScale());
                }
                
                if (brick.type === 'armored') {
                    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.roundRect(brick.x + 5, brick.y + 5, brick.width - 6, brick.height - 6, 4);
                    ctx.stroke();
                }
                
                if (brick.type === 'spawner') {
                    ctx.fillStyle = 'rgba(168, 85, 247, 0.3)';
                    ctx.beginPath();
                    ctx.roundRect(brick.x + 2, brick.y + 2, brick.width, brick.height, 6);
                    ctx.fill();

                    ctx.fillStyle = 'rgba(255,255,255,0.8)';
                    ctx.font = `${getFontSize(12)}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.fillText('👾', brick.x + 2 + brick.width / 2, brick.y + 15 * getScale());
                }
                
                // HP text
                ctx.fillStyle = 'white';
                const hpFontSize = getFontSize(brick.hp > 999 ? 10 : brick.hp > 99 ? 12 : 14);
                ctx.font = `bold ${hpFontSize}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                const textY = (brick.type === 'explosive' || brick.type === 'spawner')
                    ? brick.y + 2 + brick.height / 2 + 8 * getScale()
                    : brick.y + 2 + brick.height / 2;
                ctx.fillText(Math.ceil(brick.hp), brick.x + 2 + brick.width / 2, textY);
            }
            
            // Draw bonuses
            for (let bonus of gameState.bonuses) {
                let color = '#4ecca3';
                let text = '+' + (bonus.value || 1);
                let icon = null;
                
                if (bonus.type === 'fireball') {
                    color = '#ff6b6b';
                    text = '';
                    icon = '🔥';
                } else if (bonus.type === 'horizontal') {
                    color = '#3b82f6';
                    text = '';
                    icon = '⚡';
                } else if (bonus.type === 'superDamage') {
                    color = '#a855f7';
                    text = '';
                    icon = '💪';
                }
                
                ctx.shadowColor = color;
                ctx.shadowBlur = 10;
                
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(bonus.x, bonus.y, bonus.radius, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.shadowBlur = 0;

                ctx.fillStyle = 'white';
                ctx.font = icon ? `${getFontSize(14)}px Arial` : `bold ${getFontSize(12)}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(icon || text, bonus.x, bonus.y + (icon ? 1 : 0));
            }
            
            // Draw particles
            for (let p of gameState.particles) {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            
            // Draw laser effect
            if (gameState.laserEffect) {
                const laser = gameState.laserEffect;
                ctx.globalAlpha = laser.alpha;
                
                // Glow
                ctx.shadowColor = '#3b82f6';
                ctx.shadowBlur = 20;
                
                // Main beam
                ctx.strokeStyle = '#3b82f6';
                ctx.lineWidth = 8;
                ctx.beginPath();
                ctx.moveTo(leftBorder, laser.y);
                ctx.lineTo(rightBorder, laser.y);
                ctx.stroke();
                
                // Core white line
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(leftBorder, laser.y);
                ctx.lineTo(rightBorder, laser.y);
                ctx.stroke();
                
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 1;
            }
            
            // Draw balls
            for (let ball of gameState.balls) {
                if (!ball.active) continue;
                
                if (ball.fireball) {
                    ctx.shadowColor = '#ff6b6b';
                    ctx.shadowBlur = 8;
                    ctx.fillStyle = '#ff6b6b';
                } else if (ball.damage > 1) {
                    ctx.shadowColor = '#a855f7';
                    ctx.shadowBlur = 6;
                    ctx.fillStyle = '#a855f7';
                } else {
                    ctx.fillStyle = '#fff';
                }
                
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, getBallRadius(), 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
            
            // Draw launch indicator
            if (!gameState.isShooting) {
                ctx.fillStyle = 'rgba(255,255,255,0.9)';
                ctx.beginPath();
                ctx.arc(gameState.launchX, gameState.launchY, getBallRadius() + 2, 0, Math.PI * 2);
                ctx.fill();
                
                if (gameState.ballCount > 1) {
                    ctx.fillStyle = 'rgba(255,255,255,0.6)';
                    ctx.font = `bold ${getFontSize(11)}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.fillText('x' + gameState.ballCount, gameState.launchX, gameState.launchY + 22 * getScale());
                }
            }
            
            // Draw aim line
            if (gameState.isAiming && !gameState.isShooting) {
                const trajectory = calculateTrajectory(
                    gameState.launchX, 
                    gameState.launchY, 
                    gameState.aimAngle,
                    5
                );
                
                ctx.lineWidth = 2;
                ctx.setLineDash([8, 8]);
                
                for (let i = 0; i < trajectory.length - 1; i++) {
                    const alpha = 1 - (i * 0.15);
                    ctx.strokeStyle = `rgba(255,255,255,${Math.max(0.2, alpha * 0.7)})`;
                    
                    ctx.beginPath();
                    ctx.moveTo(trajectory[i].x, trajectory[i].y);
                    ctx.lineTo(trajectory[i + 1].x, trajectory[i + 1].y);
                    ctx.stroke();
                }
                
                ctx.setLineDash([]);
                
                for (let i = 1; i < trajectory.length - 1; i++) {
                    const point = trajectory[i];
                    if (point.isBounce) {
                        ctx.fillStyle = 'rgba(255,255,255,0.8)';
                        ctx.beginPath();
                        ctx.arc(point.x, point.y, 4, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
                
                if (trajectory.length > 1) {
                    const endPoint = trajectory[trajectory.length - 1];
                    ctx.fillStyle = `${difficultyConfig.color}cc`;
                    ctx.beginPath();
                    ctx.arc(endPoint.x, endPoint.y, 6, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            
            // Draw powerup indicators
            if (gameState.activePowerups.fireball > 0 || gameState.activePowerups.superDamage > 0) {
                const scale = getScale();
                let indicatorX = leftBorder + 10 * scale;
                const indicatorY = getBottomLine() + 20 * scale;
                const indicatorW = 50 * scale;
                const indicatorH = 20 * scale;

                if (gameState.activePowerups.fireball > 0) {
                    ctx.fillStyle = 'rgba(255, 107, 107, 0.8)';
                    ctx.beginPath();
                    ctx.roundRect(indicatorX, indicatorY, indicatorW, indicatorH, 10 * scale);
                    ctx.fill();
                    ctx.fillStyle = 'white';
                    ctx.font = `${getFontSize(11)}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.fillText('🔥 ' + gameState.activePowerups.fireball, indicatorX + indicatorW / 2, indicatorY + indicatorH * 0.7);
                    indicatorX += indicatorW + 10 * scale;
                }

                if (gameState.activePowerups.superDamage > 0) {
                    ctx.fillStyle = 'rgba(168, 85, 247, 0.8)';
                    ctx.beginPath();
                    ctx.roundRect(indicatorX, indicatorY, indicatorW, indicatorH, 10 * scale);
                    ctx.fill();
                    ctx.fillStyle = 'white';
                    ctx.font = `${getFontSize(11)}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.fillText('💪 ' + gameState.activePowerups.superDamage, indicatorX + indicatorW / 2, indicatorY + indicatorH * 0.7);
                }
            }
        }
        
        // Input handling
        function getPointerPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }
        
        function handlePointerDown(e) {
            if (gameState.gameOver || !gameState.gameStarted) return;
            
            if (gameState.isShooting) {
                gameState.speedMultiplier = FAST_SPEED_MULTIPLIER;
                gameState.isHolding = true;
                document.getElementById('speedIndicator').style.display = 'block';
                return;
            }
            
            gameState.isAiming = true;
            handlePointerMove(e);
        }
        
        function handlePointerMove(e) {
            if (!gameState.isAiming || gameState.isShooting) return;

            const pos = getPointerPos(e);
            const dx = pos.x - gameState.launchX;
            const dy = pos.y - gameState.launchY;

            let angle = Math.atan2(dy, dx);

            if (angle > -0.2) angle = -0.2;
            if (angle < -Math.PI + 0.2) angle = -Math.PI + 0.2;

            gameState.aimAngle = angle;

            // Guardar en historial con timestamp
            const now = performance.now();
            gameState.aimHistory.push({ angle: angle, timestamp: now });

            // Limpiar historial antiguo (mantener solo últimos 500ms)
            const cutoff = now - 500;
            gameState.aimHistory = gameState.aimHistory.filter(entry => entry.timestamp > cutoff);
        }
        
        function handlePointerUp(e) {
            if (gameState.isHolding) {
                gameState.speedMultiplier = 1;
                gameState.isHolding = false;
                document.getElementById('speedIndicator').style.display = 'none';
                return;
            }

            if (!gameState.isAiming) return;

            gameState.isAiming = false;

            // Usar ángulo con delay para evitar movimientos al levantar el dedo
            const POINTER_DELAY_MS = 1000; // Delay de 150ms
            const now = performance.now();
            const targetTime = now - POINTER_DELAY_MS;

            // Buscar el ángulo más cercano al tiempo objetivo (hace 150ms)
            let bestAngle = gameState.aimAngle; // Fallback al ángulo actual

            if (gameState.aimHistory.length > 0) {
                let closestEntry = null;
                let minTimeDiff = Infinity;

                for (let entry of gameState.aimHistory) {
                    const timeDiff = Math.abs(entry.timestamp - targetTime);
                    if (timeDiff < minTimeDiff) {
                        minTimeDiff = timeDiff;
                        closestEntry = entry;
                    }
                }

                if (closestEntry) {
                    bestAngle = closestEntry.angle;
                }
            }

            // Usar el ángulo con delay
            gameState.aimAngle = bestAngle;

            // Limpiar historial
            gameState.aimHistory = [];

            startShooting();
        }
        
        // Event listeners
        canvas.addEventListener('mousedown', handlePointerDown);
        canvas.addEventListener('mousemove', handlePointerMove);
        canvas.addEventListener('mouseup', handlePointerUp);
        canvas.addEventListener('mouseleave', () => {
            gameState.isAiming = false;
            gameState.aimHistory = []; // Limpiar historial al salir
            if (gameState.isHolding) {
                gameState.speedMultiplier = 1;
                gameState.isHolding = false;
                document.getElementById('speedIndicator').style.display = 'none';
            }
        });
        
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handlePointerDown(e);
        });
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            handlePointerMove(e);
        });
        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            handlePointerUp(e);
        });
        
        // Menu buttons
        document.getElementById('easyBtn').addEventListener('click', () => initGame('easy'));
        document.getElementById('mediumBtn').addEventListener('click', () => initGame('medium'));
        document.getElementById('hardBtn').addEventListener('click', () => initGame('hard'));
        document.getElementById('restartBtn').addEventListener('click', () => initGame(currentDifficulty));
        document.getElementById('menuBtn').addEventListener('click', showMainMenu);
        
        // Turn input listener
        document.getElementById('startTurnInput').addEventListener('input', updateBallsPreview);
        document.getElementById('startTurnInput').addEventListener('change', function() {
            this.value = Math.max(1, Math.min(500, parseInt(this.value) || 1));
            updateBallsPreview();
        });
        
        // Skip button - force end turn
        document.getElementById('skipBtn').addEventListener('click', function() {
            if (gameState.isShooting && !gameState.gameOver) {
                // Stop all pending ball shots
                gameState.ballsToShoot = 0;
                if (shootTimeout) {
                    clearTimeout(shootTimeout);
                    shootTimeout = null;
                }
                // Deactivate all balls
                for (let ball of gameState.balls) {
                    ball.active = false;
                }
                // End the turn
                endTurn();
            }
        });
        
        // Game loop
        function gameLoop() {
            if (gameState.gameStarted && !gameState.gameOver) {
                updateBalls();
                updateParticles();
            }
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        // Start
        createMenuBalls();
        gameLoop();

        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js')
                .then(reg => console.log('Service Worker registrado'))
                .catch(err => console.log('Error registrando SW:', err));
        }
    </script>
</body>
